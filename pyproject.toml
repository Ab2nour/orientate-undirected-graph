[project]
name = "projet-graphe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.6",
    "networkx>=3.5",
    "numpy>=2.3.3",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "RUF",
    "FURB",
    "W",
    "PERF",
    "N",
    "PD",
    "NPY",
    "FLY",
    "PTH",
    "ARG",
    "TC",
    "SLOT",
    "SIM",
    "SLF",
    "Q",
    "PT",
    "PYI",
    "ANN",
    "DOC",
    "D",
    "D212",
    "D402",
    "D415",
    "D417",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.poe]
    [tool.poe.tasks.test]
    help = "Test the codebase"
    sequence = [
        {cmd = "uv run pytest --doctest-modules"},
    ]

    [tool.poe.tasks.format]
    help = "Format the files"
    sequence = [
        {cmd = "uv run ruff format"},
    ]

    [tool.poe.tasks.lint]
    help = "Lint the files"
    sequence = [
        {cmd = "uv run ruff check --fix"},
    ]

    [tool.poe.tasks.check]
    help = "Check formatting & linting"
    sequence = [
        {cmd = "uv run ruff format --check"},
        {cmd = "uv run ruff check"},
    ]
